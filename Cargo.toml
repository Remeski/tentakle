[package]
name = "tentakle"
version = "0.0.1"
edition = "2024"

[dependencies]
asciigraphix-core = { version = "0.1.0", path = "../asciigraphix/asciigraphix-core" }
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
config = "0.15.23"
crossterm = { version = "0.29.0", features = ["event-stream"] }
derive_setters = "0.1.9"
directories = "6.0.0"
futures = "0.3.32"
prometheus-parser = "0.4.2"
ratatui = "0.30.0"
reqwest = { version = "0.13.3", features = ["json", "multipart", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
socket2 = "0.6.3"
time = { version = "0.3.47", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
