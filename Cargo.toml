pocketbase-sdk = "0.1.1"
ratatui = "0.30.0"
reqwest = { version = "0.13.3", features = ["json", "multipart", "query"] }
serde = "1.0.228"
serde_json = "1.0.150"
socket2 = "0.6.3"
tokio = { version = "1.52.3", features = ["full"] }
